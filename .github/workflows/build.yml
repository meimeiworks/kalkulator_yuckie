name: Build YukiCalc Android 14+ APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create valid AndroidManifest.xml via Python
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main", exist_ok=True)
          a = "andr" + "oid"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:{a}="http://android.com">
              <application {a}:label="YukiCalc" {a}:theme="@{a}:style/Theme.Material.NoActionBar">
                  <activity {a}:name=".MainActivity" {a}:exported="true">
                      <intent-filter>
                          <action {a}:name="android.intent.action.MAIN" />
                          <category {a}:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YukiCalc-Android14-APK
          path: app/build/outputs/apk/debug/app-debug.apk
